name: Build AlqanasNet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug & Release APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlqanasNet-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

     - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias alqanas -storepass alqanas123 -keypass alqanas123 -dname "CN=AlqanasNet, O=Alqanas, C=YE"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner sign --ks release.jks --ks-pass pass:alqanas123 --key-pass pass:alqanas123 --out app/build/outputs/apk/release/AlqanasNet-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
     
      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: AlqanasNet-Release-APK
          path: app/build/outputs/apk/release/*.apk
